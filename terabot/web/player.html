<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Terabot Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2e2e4a;
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #player-wrap {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #title-bar {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    #title-bar .icon { font-size: 20px; flex-shrink: 0; }

    #file-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    #video-container {
      width: 100%;
      background: #000;
      position: relative;
      aspect-ratio: 16/9;
    }

    video { width: 100%; height: 100%; display: block; }

    #status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0,0,0,0.75);
      z-index: 5;
      padding: 24px;
      text-align: center;
    }

    #status-overlay.hidden { display: none; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(108,99,255,0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status-text { font-size: 14px; color: var(--muted); }

    #error-box { display: none; flex-direction: column; align-items: center; gap: 12px; }
    #error-box.show { display: flex; }

    .error-icon { font-size: 36px; }
    .error-title { font-size: 16px; font-weight: 700; color: var(--danger); }
    .error-msg { font-size: 13px; color: var(--muted); line-height: 1.5; }

    #info-bar {
      width: 100%;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    #dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    #dl-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

<div id="player-wrap">
  <div id="title-bar">
    <span class="icon">🎬</span>
    <span id="file-title">Loading...</span>
  </div>

  <div id="video-container">
    <div id="status-overlay">
      <div class="spinner"></div>
      <div id="status-text">Preparing video...</div>
      <div id="error-box">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Playback Failed</div>
        <div class="error-msg" id="error-detail">
          The link may have expired. Please resend the Terabox link to get a fresh one.
        </div>
      </div>
    </div>
    <video id="vid" controls playsinline preload="metadata"></video>
  </div>

  <div id="info-bar">
    <span id="format-label">Video</span>
    <a id="dl-btn" href="#" target="_blank">📥 Download</a>
  </div>
</div>

<script>
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const params = new URLSearchParams(window.location.search);
  const rawUrl = params.get("url") || "";
  const name   = params.get("name") || "terabox_file";

  document.getElementById("file-title").textContent = name;
  document.getElementById("dl-btn").href = rawUrl;

  const ext = (name.split(".").pop() || "").toLowerCase();
  const formatMap = { mp4: "MP4", mkv: "MKV", webm: "WebM", avi: "AVI", mov: "MOV", flv: "FLV" };
  document.getElementById("format-label").textContent = formatMap[ext] || "Video";

  const statusOverlay = document.getElementById("status-overlay");
  const statusText    = document.getElementById("status-text");
  const errorBox      = document.getElementById("error-box");
  const errorDetail   = document.getElementById("error-detail");
  const vid           = document.getElementById("vid");
  const spinner       = document.querySelector(".spinner");

  function showError(msg) {
    spinner.style.display = "none";
    statusText.style.display = "none";
    errorBox.classList.add("show");
    if (msg) errorDetail.textContent = msg;
  }

  function hideOverlay() {
    statusOverlay.classList.add("hidden");
  }

  if (!rawUrl) {
    showError("No video URL provided.");
  } else {
    // ✅ Direct URL — no proxy, no Replit middleman
    statusText.textContent = "Buffering...";
    vid.src = rawUrl;

    vid.addEventListener("canplay", () => {
      hideOverlay();
      vid.play().catch(() => {});
    });

    vid.addEventListener("error", () => {
      const code = vid.error ? vid.error.code : null;
      if (code === 4) {
        showError("This video format is not supported by your browser. Try downloading instead.");
      } else {
        showError("Playback failed. The link may have expired. Resend the Terabox link for a fresh one.");
      }
    });

    vid.addEventListener("stalled", () => {
      statusText.textContent = "Connection slow, still buffering...";
    });
  }
</script>
</body>
</html>
